# pytest configuration

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short

# An unregistered mark is an error. pytest 9 reads --strict-markers as an override of its strict_markers option, and applies an override that
# comes from addopts after the options were read, so there the flag above does nothing; this line is what stops the run, on any version.
filterwarnings =
    error::pytest.PytestUnknownMarkWarning

markers =
    slow: slow tests
    e2e: the chat page in a real Chrome (tests/e2e)
    cuda: tests requiring CUDA
    willi_parity: tests that validate Python 3.9.23 / willi server compatibility
